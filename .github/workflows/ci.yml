name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-format:
    name: "Stage 1: Fast Lint & Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Go Format & Vet
        run: |
          test -z "$(gofmt -l .)" || (echo "Unformatted Go code detected:" && gofmt -d . && exit 1)
          go vet ./...

  vulnerability-audit:
    name: "Stage 1.5: Security Vulnerability Scan"
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  unit-and-boundary-tests:
    name: "Stage 2: Deterministic Unit & Boundary Tests"
    runs-on: ubuntu-latest
    needs: lint-and-format
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rcsrag
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: gmessages_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rcsrag -d gmessages_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://rcsrag:changeme@localhost:5432/gmessages_test?sslmode=disable
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run Tests with Race Detector & Coverage
        run: |
          # HARN-03: the `gm` package installs a deny-all HTTP transport by default,
          # so the suite never reaches the internet. DATABASE_URL targets the
          # Postgres+pgvector service above, enabling the DB integration suite (DB-07).
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Enforce Coverage Floors
        run: |
          set -euo pipefail
          total=$(go tool cover -func=coverage.out | awk '/^total:/{gsub("%","",$3); print $3}')
          dbcov=$(go test -cover ./internal/db/... | grep -oE 'coverage: [0-9.]+' | grep -oE '[0-9.]+' | head -1)
          echo "total=${total}% db=${dbcov}%"
          awk -v c="${total}" 'BEGIN{exit !(c>=75)}' || { echo "Total coverage ${total}% below 75% floor"; exit 1; }
          awk -v c="${dbcov}" 'BEGIN{exit !(c>=75)}' || { echo "internal/db coverage ${dbcov}% below 75% floor"; exit 1; }

      - name: Compile-Check Live-Tagged Tests (No Execution)
        run: go vet -tags live ./...

  container-build:
    name: "Stage 3: Container Immutability & Build Verification"
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Docker Compose Config
        run: |
          docker compose config

      - name: Build Docker Container
        run: |
          docker build -t gmessages-rag:ci .

  living-docs-check:
    name: "Stage 4: Living Docs & Requirements Traceability"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Architecture, Requirements & Plan Integrity
        run: |
          test -f docs/ARCHITECTURE.md || (echo "Missing docs/ARCHITECTURE.md" && exit 1)
          test -f docs/REQUIREMENTS.md || (echo "Missing docs/REQUIREMENTS.md" && exit 1)
          test -f docs/CHANGELOG.md || (echo "Missing docs/CHANGELOG.md" && exit 1)
          test -f docs/PLAN.md || (echo "Missing docs/PLAN.md" && exit 1)

      - name: Enforce Requirement Traceability
        run: bash scripts/check_traceability.sh
