services:
  db:
    image: pgvector/pgvector:pg17
    container_name: gmessages-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rcsrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-gmessages}
      TZ: ${TZ:-America/Chicago}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rcsrag} -d ${POSTGRES_DB:-gmessages}"]
      interval: 5s
      timeout: 5s
      retries: 5

  gmessages-rag:
    image: ${GMESSAGES_IMAGE:-ghcr.io/spelech/gmessage-rag:v1.0.0}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gmessages-rag
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/Chicago}
      DATABASE_URL: postgres://${POSTGRES_USER:-rcsrag}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-gmessages}?sslmode=disable
      HTTP_PORT: "8090"
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DOSSIER_MODEL: ${DOSSIER_MODEL:-anthropic/claude-3.7-sonnet}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-google/gemini-2.5-flash}
      VISION_MODEL: ${VISION_MODEL:-google/gemini-2.5-flash}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      TRACKED_CONTACTS: ${TRACKED_CONTACTS:-}
      SESSION_GAP_HOURS: ${SESSION_GAP_HOURS:-2}
      DOSSIER_DEBOUNCE_MINUTES: ${DOSSIER_DEBOUNCE_MINUTES:-30}
      MAX_BACKFILL_MESSAGES: ${MAX_BACKFILL_MESSAGES:-5000}
      PAUSE_INGESTION: ${PAUSE_INGESTION:-false}
      ENABLE_MCP_SEND_MESSAGE: ${ENABLE_MCP_SEND_MESSAGE:-false}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      APPRISE_URL: ${APPRISE_URL:-}
      NTFY_URL: ${NTFY_URL:-}
      EXTERNAL_WEB_URL: ${EXTERNAL_WEB_URL:-http://10.0.0.10:8090}
      NOTIFY_ON_PHONE_DISCONNECT: ${NOTIFY_ON_PHONE_DISCONNECT:-false}
      PHONE_DISCONNECT_GRACE_MINUTES: ${PHONE_DISCONNECT_GRACE_MINUTES:-15}
      ENABLE_READ_RECEIPT_HEURISTIC: ${ENABLE_READ_RECEIPT_HEURISTIC:-true}
      PULL_FULL_SIZE_MEDIA: ${PULL_FULL_SIZE_MEDIA:-false}
      SYNC_GOOGLE_CONTACTS: ${SYNC_GOOGLE_CONTACTS:-true}
      SYNC_MODE: ${SYNC_MODE:-continuous}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-30}
      SYNC_WINDOW_MINUTES: ${SYNC_WINDOW_MINUTES:-5}
      GM_PING_INTERVAL_MINUTES: ${GM_PING_INTERVAL_MINUTES:-5}
      GM_ALERT_TIMEOUT_COUNT: ${GM_ALERT_TIMEOUT_COUNT:-2}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 512M
    ports:
      - "${HOST_PORT:-8090}:8090"
      - "3000:8090"
    volumes:
      - ${DATA_DIR:-./data}/auth:/data/auth
      - ${DATA_DIR:-./data}/media:/data/media
      - ${DATA_DIR:-./data}/dossiers:/data/dossiers
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8090/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - net_webservices
      - net_mcp
    labels:
      - "tinyauth.apps.messagesrag.config.domain=messages.wileyriley.com"
      - "tinyauth.apps.messagesrag.oauth.groups=full_admin"
      - "portal.messagesrag.name=Messages RAG"
      - "portal.messagesrag.description=Google Messages SMS/RCS Ingestion & Distillation"
      - "portal.messagesrag.category=AI & Context"
      - "portal.messagesrag.icon=fa-solid fa-comments"
      - "portal.messagesrag.color=#06b6d4"

volumes:
  pgdata:

networks:
  default:
    ipam:
      config:
        - subnet: 192.168.48.0/24
  net_webservices:
    external: true
  net_mcp:
    external: true
